<dialog id="about_modal" class="modal">
    <div class="modal-box max-w-md p-0 overflow-hidden">

        <div class="relative bg-gradient-to-b from-primary/10 via-base-100 to-base-100 px-8 pt-10 pb-6 text-center">
            <img src="{{ static_url('img/struudel-512px.png') }}"
                 alt=""
                 width="128" height="128"
                 class="mx-auto drop-shadow-md">
            <h2 class="mt-4 text-2xl font-bold tracking-tight">Struudel</h2>
            <p class="mt-1 text-sm text-base-content/60">
                Self-hosted Doodle-style polling tool.
            </p>
            <div class="mt-3 inline-flex items-center gap-2 text-xs text-base-content/55">
                <span class="font-medium">v{{ app_version }}</span>
                <span class="opacity-40">&middot;</span>
                <code class="font-mono">{{ app_commit }}</code>
            </div>
        </div>

        <div class="px-8 py-5 text-center border-t border-base-200">
            <p class="text-sm text-base-content/80">
                &copy; {{ current_year }}
                <a href="https://netways.de"
                   target="_blank" rel="noopener noreferrer"
                   class="link link-hover font-medium">NETWAYS GmbH</a>
            </p>
            <p class="mt-1 text-xs text-base-content/55">
                Released under the
                <a href="https://github.com/NETWAYS/struudel/blob/main/LICENSE"
                   target="_blank" rel="noopener noreferrer"
                   class="link link-hover font-medium">MIT License</a>
            </p>
        </div>

        <div class="px-8 pb-6 pt-2 flex items-center justify-center gap-2">
            <a href="https://github.com/NETWAYS/struudel"
               target="_blank" rel="noopener noreferrer"
               class="btn btn-sm btn-outline gap-2">
                <i class="ti ti-brand-github text-base"></i>GitHub
            </a>
            <form method="dialog">
                <button class="btn btn-sm btn-ghost">Close</button>
            </form>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
